      - label: Ruby + Native
        lang: ruby_native
        source: 'require ''uri''

          require ''net/http''

          require ''openssl''


          url = URI("https://api.bugcrowd.com/submissions/search")


          http = Net::HTTP.new(url.host, url.port)

          http.use_ssl = true

          http.verify_mode = OpenSSL::SSL::VERIFY_NONE


          request = Net::HTTP::Post.new(url)

          request["Authorization"] = ''REPLACE_KEY_VALUE''

          request["content-type"] = ''application/json''

          request.body = "{\"filter\":{\"assignees\":[\"me,none,program-admin@example.com\"],\"assignee\":[\"me,none,program-admin@example.com\"],\"engagement\":[\"engagement_code\"],\"blocked_by\":[\"bugcrowd-operations\"],\"duplicate\":true,\"payments\":[\"present\"],\"points\":[\"none\"],\"program\":[\"program-code\"],\"researcher\":[\"string\"],\"retest\":[\"pending\"],\"search\":\"string\",\"severity\":[2],\"source\":[\"api\"],\"state\":[\"new\"],\"submitted\":\"2019-08-24\",\"target\":[\"string\"],\"target_type\":[\"website\"],\"updated\":\"2019-08-24\",\"last_activity_feed_item_created_at\":\"2019-08-24\",\"vrt\":\"cross_site_scripting_xss\"},\"sort\":[\"submitted-desc\"],\"page\":{\"limit\":25,\"offset\":0},\"include\":[\"activities\"],\"fields\":{\"activity\":[\"created_at\"],\"blocker\":[\"unblocked_at\"],\"researcher_request_response\":[\"reason\"],\"claim_ticket\":[\"claimed_at\"],\"comment\":[\"body\"],\"cvss_vector\":[\"attack_complexity\"],\"engagement\":[\"id\"],\"engagement_brief\":[\"id\"],\"target_group\":[\"name\"],\"external_issue\":[\"remote_id\"],\"file_attachment\":[\"file_name\"],\"identity\":[\"name\"],\"monetary_reward\":[\"amount_cents\"],\"organization\":[\"name\"],\"payment\":[\"amount_cents\"],\"program\":[\"code\"],\"submission\":[\"bug_url\"],\"target\":[\"name\"],\"event\":[\"created_at\"]}}"


          response = http.request(request)

          puts response.read_body'
