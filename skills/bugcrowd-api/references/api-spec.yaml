      parameters:
      - $ref: '#/components/parameters/WebhookSignatureParameter'
      requestBody:
        description: 'Submission created webhook - this request will be executed whenever a submission
          is created


          For how to set up and use webhooks, [see here](https://docs.bugcrowd.com/api/webhooks/)

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubmissionCreatedRequest'
      responses:
        '200':
          $ref: '#/components/responses/WebhookReceivedResponse'
  submissionUpdated:
    post:
      tags:
      - submission_webhooks
      security: []
      parameters:
      - $ref: '#/components/parameters/WebhookSignatureParameter'
      requestBody:
        description: 'Submission updated webhook - this request will be executed when a submission is
          updated

          and will include which fields changed on the submission as:


          ```json

          { "field_name": { "from": "previous", "to": "new" } }

          ```


          For how to set up and use webhooks, [see here](https://docs.bugcrowd.com/api/webhooks/)

          '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubmissionUpdatedRequest'
      responses:
        '200':
          $ref: '#/components/responses/WebhookReceivedResponse'
security:
- tokenAuth: []
