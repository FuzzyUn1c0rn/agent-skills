  - reward_range_resource
  - target_resource
  - target_group_resource
  - authorization_log_resource
  - authentication_log_resource
  - disclosure_request_resource
  - team_resource
- name: Webhooks
  tags:
  - blocker_webhooks
  - submission_webhooks
paths:
  /credential_buckets:
    post:
      summary: Create cred bucket
      operationId: createCredentialBucket
      tags:
      - Submissions API
      - credential_bucket_resource
      description: Create a credential bucket
      requestBody:
        required: true
        content:
          application/vnd.bugcrowd.v4+json:
            schema:
              $ref: '#/components/schemas/CreateCredentialBucketRequest'
            examples:
              ValidExample:
                value:
                  data:
                    type: credential_bucket
                    attributes:
                      name: Cred bucket name
                      credential_type: email
                      credentials_per_researcher: 1
                      description: Cred bucket description
                      is_ready: true
                      low_balance_threshold: 1
                    relationships:
                      program:
                        data:
                          id:
                            $ref: '#/general_helpers/ValidUUID'
                          type: program
      responses:
        '201':
          description: Credential bucket created
          content:
            application/vnd.bugcrowd.v4+json:
              schema:
                $ref: '#/components/schemas/CredentialBucketResponse'
              examples:
                ValidExample:
                  value:
                    data:
                      id:
                        $ref: '#/general_helpers/ValidUUID'
                      type: credential_bucket
                      attributes:
                        name: Credential bucket name
                        credential_type: email
                        credentials_per_researcher: 1
                        description: Credential bucket description
                        is_ready: true
                        low_balance_threshold: 1
                      relationships:
                        program:
                          data:
                            type: program
                            id:
                              $ref: '#/general_helpers/ValidUUID'
                      links:
                        self: (NOT IMPLEMENTED YET)
        '400':
          description: Error indicating malformed request payload
          content:
            application/vnd.bugcrowd.v4+json:
              schema:
                $ref: '#/general_helpers/ErrorContent'
        '404':
          description: An error indicating missing resource.
          content:
            application/vnd.bugcrowd.v4+json:
              schema:
                $ref: '#/general_helpers/ErrorContent'
        '409':
          description: Incorrect data type parameter
          content:
            application/vnd.bugcrowd.v4+json:
              schema:
                $ref: '#/general_helpers/ErrorContent'
        '422':
          description: Error indicating unprocessable attributes
          content:
            application/vnd.bugcrowd.v4+json:
              schema:
                $ref: '#/general_helpers/ErrorContent'
    get:
      summary: Index cred bucket
      operationId: listCredentialBuckets
      tags:
      - Submissions API
      - credential_bucket_resource
      description: Returns a list of credential bucket instances belinging to the program.
      parameters:
      - $ref: '#/components/parameters/ProgramIDFilterParameter'
      - $ref: '#/components/parameters/CredentialBucketFieldsParameter'
      - $ref: '#/components/parameters/CredentialFieldsParameter'
      - $ref: '#/components/parameters/CredentialBucketIncludeParameter'
      responses:
        '200':
          description: A JSON object with a `data` property containing an array of credential bucket objects.
          content:
            application/vnd.bugcrowd.v4+json:
              schema:
                $ref: '#/components/schemas/ListCredentialBucketResponse'
              examples:
                ValidExample:
                  value:
                    data:
                    - id:
                        $ref: '#/general_helpers/ValidUUID'
                      type: credential_bucket
                      attributes:
                        credential_type: email
                      relationships: {}
                    included:
                    - id:
                        $ref: '#/general_helpers/ValidUUID'
                      type: credential
                      attributes:
                        credential_bucket_id:
                          $ref: '#/general_helpers/ValidUUID'
                      links:
                        self: (NOT IMPLEMENTED YET)
        '400':
          description: An error object indicating unsupported request parameters.
          content:
            application/vnd.bugcrowd.v4+json:
              schema:
                $ref: '#/general_helpers/ErrorContent'
              examples:
                InvalidParamValue:
                  value:
                    errors:
                    - title: Bad Request
                      status: '400'
                      detail: 'The property ''#/fields/credential_bucket/0'' value ''invalid_value'' did
                        not match one of the following values: credential_type, credentials_per_researcher,
                        description, is_ready, low_balance_threshold, name, credentials, bounty.'
                      source:
                        pointer: /fields/credential_bucket/0
                    - title: Bad Request
                      status: '400'
                      detail: 'The property ''#/fields/credential/0'' value ''invalid_value'' did not
                        match one of the following values: credential_bucket_id, user_id, data.'
                      source:
                        pointer: /fields/credential/0
                    - title: Bad Request
                      status: '400'
                      detail: 'The property ''#/include/0'' value ''invalid_resource'' did not match one
                        of the following values: credentials.'
                      source:
                        pointer: /include/0
        '404':
          description: An error indicating missing resource.
          content:
            application/vnd.bugcrowd.v4+json:
              schema:
                $ref: '#/general_helpers/ErrorContent'
              example:
                errors:
                  $ref: '#/general_helpers/NotFoundError'
  /credential_buckets/{id}:
    get:
      summary: Show cred bucket
      operationId: showCredentialBucket
      tags:
      - Submissions API
      - credential_bucket_resource
      description: Returns a credential bucket instance
      parameters:
      - $ref: '#/components/parameters/IDParameter'
      - $ref: '#/components/parameters/CredentialBucketFieldsParameter'
      - $ref: '#/components/parameters/CredentialFieldsParameter'
      - $ref: '#/components/parameters/CredentialBucketIncludeParameter'
      responses:
        '200':
          description: Returns a single credential bucket by UUID.
          content:
            application/vnd.bugcrowd.v4+json:
              schema:
                $ref: '#/components/schemas/GetCredentialBucketResponse'
              examples:
                ValidExample:
                  value:
                    data:
                      id:
                        $ref: '#/general_helpers/ValidUUID'
                      type: credential_bucket
                      attributes:
                        credential_type: email
                      relationships: {}
                    included:
                    - id:
                        $ref: '#/general_helpers/ValidUUID'
                      type: credential
                      attributes:
                        credential_bucket_id:
                          $ref: '#/general_helpers/ValidUUID'
                      links:
                        self: (NOT IMPLEMENTED YET)
        '400':
          description: An error object indicating unsupported request parameters.
          content:
            application/vnd.bugcrowd.v4+json:
              schema:
                $ref: '#/general_helpers/ErrorContent'
              examples:
                InvalidParamValue:
                  value:
                    errors:
                    - title: Bad Request
                      status: '400'
                      detail: 'The property ''#/fields/credential_bucket/0'' value ''invalid_value'' did
                        not match one of the following values: credential_type, credentials_per_researcher,
                        description, is_ready, low_balance_threshold, name, credentials, bounty.'
                      source:
                        pointer: /fields/credential_bucket/0
                    - title: Bad Request
                      status: '400'
                      detail: 'The property ''#/fields/credential/0'' value ''invalid_value'' did not
                        match one of the following values: credential_bucket_id, user_id, data.'
                      source:
                        pointer: /fields/credential/0
                    - title: Bad Request
                      status: '400'
                      detail: 'The property ''#/include/0'' value ''invalid_resource'' did not match one
                        of the following values: credentials.'
                      source:
                        pointer: /include/0
        '404':
          description: An error indicating missing resource.
          content:
            application/vnd.bugcrowd.v4+json:
              schema:
                $ref: '#/general_helpers/ErrorContent'
              example:
                errors:
                  $ref: '#/general_helpers/NotFoundError'
    patch:
      summary: Update cred bucket
      operationId: updateCredentialBucket
      tags:
      - Submissions API
      - credential_bucket_resource
      description: Update a credential bucket
      parameters:
      - $ref: '#/components/parameters/IDParameter'
      requestBody:
        required: true
        content:
          application/vnd.bugcrowd.v4+json:
            schema:
              $ref: '#/components/schemas/UpdateCredentialBucketRequest'
            examples:
              ValidExample:
                value:
                  data:
                    type: credential_bucket
                    attributes:
                      name: Credential bucket name
                      credentials_per_researcher: 1
                      description: Credential bucket description
                      is_ready: true
                      low_balance_threshold: 1
      responses:
        '200':
          description: Credential bucket updated
          content:
            application/vnd.bugcrowd.v4+json:
              schema:
                $ref: '#/components/schemas/CredentialBucketResponse'
              examples:
                ValidExample:
                  value:
                    data:
                      id:
                        $ref: '#/general_helpers/ValidUUID'
                      type: credential_bucket
                      attributes:
                        name: Cred bucket name
                        credential_type: email
                        credentials_per_researcher: 1
                        description: Cred bucket description
                        is_ready: true
                        low_balance_threshold: 1
                      relationships:
                        program:
                          data:
                            type: program
                            id:
                              $ref: '#/general_helpers/ValidUUID'
        '400':
          description: Error indicating malformed request payload
          content:
            application/vnd.bugcrowd.v4+json:
              schema:
                $ref: '#/general_helpers/ErrorContent'
        '404':
          description: An error indicating missing resource.
          content:
            application/vnd.bugcrowd.v4+json:
              schema:
                $ref: '#/general_helpers/ErrorContent'
        '409':
          description: Incorrect data type parameter
          content:
            application/vnd.bugcrowd.v4+json:
              schema:
                $ref: '#/general_helpers/ErrorContent'
        '422':
          description: Error indicating unprocessable attributes
          content:
            application/vnd.bugcrowd.v4+json:
              schema:
                $ref: '#/general_helpers/ErrorContent'
  /organizations/{id}:
    get:
      summary: Fetch organization
      operationId: getOrganization
      tags:
      - Submissions API
      - organization_resource
      description: Returns a single organization by UUID.
      parameters:
      - $ref: '#/components/parameters/IDParameter'
      - $ref: '#/components/parameters/OrganizationFieldsParameter'
      - $ref: '#/components/parameters/ProgramFieldsParameter'
      - $ref: '#/components/parameters/TargetFieldsParameter'
      - $ref: '#/components/parameters/OrganizationIncludeParameter'
      responses:
        '200':
          description: A JSON object with a `data` property containing an organization object.
          content:
            application/vnd.bugcrowd.v4+json:
              schema:
                $ref: '#/components/schemas/GetOrganizationResponse'
              examples:
                ValidExample:
                  value:
                    data:
                      id:
                        $ref: '#/general_helpers/ValidUUID'
                      type: organization
                      attributes:
                        name: name
                      relationships:
                        programs:
                          data:
                          - id:
                              $ref: '#/general_helpers/ValidUUID'
                            type: program
                          links:
                            related:
                              href: /programs?filter[organization_id]=10000000-0000-0000-0000-000000000000
                              meta:
                                count: 1
                                total_hits: 1
                      links:
                        self: /organizations/10000000-0000-0000-0000-000000000000
                    included: []
        '400':
          description: An error object indicating unsupported request parameters.
          content:
            application/vnd.bugcrowd.v4+json:
              schema:
                $ref: '#/general_helpers/ErrorContent'
              examples:
                InvalidParamValue:
                  value:
                    errors:
                    - $ref: '#/error_helpers/OrganizationFieldsEnumBadRequest'
                    - $ref: '#/error_helpers/ProgramFieldsEnumBadRequest'
                    - $ref: '#/error_helpers/TargetFieldsEnumBadRequest'
                    - title: Bad Request
                      status: '400'
                      detail: 'The property ''#/include/0'' value ''invalid_resource'' did not match one
                        of the following values: programs, targets.'
                      source:
                        pointer: /include/0
        '404':
          description: An error indicating missing resource.
          content:
            application/vnd.bugcrowd.v4+json:
              schema:
                $ref: '#/general_helpers/ErrorContent'
              examples:
                InvalidUrlId:
                  value:
                    errors:
                      $ref: '#/general_helpers/NotFoundError'
      x-codeSamples:
      - label: Shell + Curl
        lang: shell_curl
        source: "curl --request GET \\\n  --url 'https://api.bugcrowd.com/organizations/%7Bid%7D?fields%5Borganization%5D=SOME_ARRAY_VALUE&fields%5Bprogram%5D=SOME_ARRAY_VALUE&fields%5Btarget%5D=SOME_ARRAY_VALUE&include=SOME_ARRAY_VALUE'\
          \ \\\n  --header 'Authorization: REPLACE_KEY_VALUE'"
      - label: Node + Native
        lang: node_native
        source: "const http = require(\"https\");\n\nconst options = {\n  \"method\": \"GET\",\n  \"hostname\"\
          : \"api.bugcrowd.com\",\n  \"port\": null,\n  \"path\": \"/organizations/%7Bid%7D?fields%5Borganization%5D=SOME_ARRAY_VALUE&fields%5Bprogram%5D=SOME_ARRAY_VALUE&fields%5Btarget%5D=SOME_ARRAY_VALUE&include=SOME_ARRAY_VALUE\"\
