        required: true
        content:
          application/vnd.bugcrowd.v4+json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionRequest'
            examples:
              ValidExample:
                value:
                  data:
                    type: submission
                    attributes:
                      title: This is a good title
                      description: This contains a POC
                    relationships:
                      program:
                        data:
                          type: program
                          id:
                            $ref: '#/general_helpers/ValidUUID'
              InvalidProvidedType:
                value:
                  data:
                    type: invalid_type
              ClientGeneratedID:
                value:
                  data:
                    type: submission
                    id:
                      $ref: '#/general_helpers/ValidUUID'
              InvalidAttribute:
                value:
                  data:
                    type: submission
                    attributes:
                      invalid_attribute: value
              InvalidAttributeType:
                value:
                  data:
                    type: submission
                    attributes:
                      title: This is a good title
                      description: This contains a POC
                      severity: '3'
                    relationships:
                      program:
                        data:
                          type: program
                          id:
                            $ref: '#/general_helpers/ValidUUID'
