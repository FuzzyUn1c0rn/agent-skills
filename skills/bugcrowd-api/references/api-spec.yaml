    CreateSubmissionRequest:
      type: object
      required:
      - data
      additionalProperties: false
      properties:
        data:
          type: object
          required:
          - type
          - attributes
          - relationships
          additionalProperties: false
          properties:
            type:
              type: string
              enum:
              - submission
              example: submission
            attributes:
              type: object
              required:
              - title
              - description
              additionalProperties: false
              properties:
                bug_url:
                  type: string
                  nullable: true
                custom_fields:
                  type: object
                  additionalProperties:
                    type: string
                    nullable: true
                  example:
                    custom_field_label: custom_value
                description:
                  type: string
                extra_info:
                  type: string
                  nullable: true
                http_request:
                  type: string
                  nullable: true
                researcher_email:
                  type: string
                  nullable: true
                  format: email
                severity:
                  $ref: '#/domain_model_helpers/SeverityNullableSchema'
                state:
                  $ref: '#/domain_model_helpers/SubstateEnum'
                submitted_at:
                  type: string
                  format: date-time
                  example: '2018-11-13T20:20:39+00:00'
                title:
                  type: string
                cvss_string:
                  type: string
                  nullable: true
                  format: cvss
                  description: 'CVSS vector string in v3.0, v3.1, or v4.0 format.

                    Example (v3.1): CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L

                    Example (v4.0): CVSS:4.0/AV:N/AC:L/AT:N/PR:N/UI:N/VC:H/VI:H/VA:H/SC:N/SI:N/SA:N

                    '
                  pattern: ^CVSS:(3\.[01]|4\.0)/.*$
                  example: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:L
                vrt_id:
                  type: string
                  nullable: true
                  format: vrt
                  example: cross_site_scripting_xss
                  pattern: ^[a-z][a-z_\.0-9]*[a-z0-9]$
            relationships:
              type: object
              additionalProperties: false
