    example: bugcrowd.v4; format=json
  AcceptParameter:
    type: string
    description: The media type of the Bugcrowd API for the current request
    x-example: application/vnd.bugcrowd+json
    example: application/vnd.bugcrowd+json
  BugcrowdVersionParameter:
    type: string
    description: The request header used to test new API versions before updating the pinned account version
    x-example: '2025-02-25'
    example: '2025-02-25'
