openapi: 3.0.2
info:
  title: Bugcrowd REST API
  description: 'This is Bugcrowd''s primary REST API and follows the [JSON API specification](https://jsonapi.org/format/).


    For more information on how to get started check out the [usage documentation](https://docs.bugcrowd.com/api/usage/)

    '
  version: 1.1.0
  contact:
    name: Bugcrowd REST API
    url: https://bugcrowd-support.freshdesk.com/support/tickets/new
servers:
- url: https://api.bugcrowd.com
  description: Main production server
tags:
- name: Submissions API
  description: API used for submission workflows and data synchronization.
- name: access_grant_resource
  x-displayName: AccessGrant
  description: 'The`access_grant` resource defines a user''s role based access to another resource.

    These can be revoked after invite acceptance.


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    #### AccessGrant resource schema


    < SchemaDefinition schemaRef = "#/components/schemas/AccessGrant" />

    '
- name: access_invitation_resource_role_resource
  x-displayName: ResourceRole
  description: 'The `resource_role` represents a role on a program or organization defined within an

    `access_invitation` resource.


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    #### ResourceRole resource schema


    < SchemaDefinition schemaRef = "#/components/schemas/ResourceRole" />

    '
- name: activity_resource
  x-displayName: Activity
  description: 'The `activity` resource describes a historic action on a resource. Currently they can
    be included on a `submission`.


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    ```shell

    api.bugcrowd.com/submissions?fields[submission]=activities&include=activities&fields[activity]=key

    ```


    #### Activity resource schema


    <SchemaDefinition schemaRef="#/components/schemas/Activity"/>

    '
- name: authentication_log_resource
  x-displayName: AuthenticationLog
  description: 'The `authentication_log` resource describes a historic log of access to the platform.


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    ```shell

    api.bugcrowd.com/authentication_logs

    ```

    #### AuthenticationLog resource schema

    <SchemaDefinition schemaRef="#/components/schemas/AuthenticationLog"/>

    '
- name: authorization_log_resource
  x-displayName: AuthorizationLog
  description: 'The `authorization_log` resource describes a historic log of authorization access granted
    to an ogranization an the role assigned.


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    ```shell

    api.bugcrowd.com/authorization_logs

    ```

    #### AuthorizationLog resource schema

    <SchemaDefinition schemaRef="#/components/schemas/AuthorizationLog"/>

    '
- name: blocker_webhooks
  x-displayName: Blocker webhooks
  description: Webhooks for the `blocker` resource
- name: claim_ticket_resource
  x-displayName: ClaimTicket
  description: 'A `claim_ticket` represents an ability for someone to claim a submission as theirs, often
    when submitted through channels

    such as the external form, email, or submissions created via the API.


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    #### ClaimTicket resource schema


    <SchemaDefinition schemaRef="#/components/schemas/ClaimTicket"/>

    '
- name: comment_resource
  x-displayName: Comment
  description: 'Comments are messages left after the submission was created, which can be included on
    the `/submissions` endpoint.


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    ```shell

    api.bugcrowd.com/submissions?fields[submission]=comments&include=comments&fields[comment]=body,author

    ```


    #### Comment resource schema


    <SchemaDefinition schemaRef="#/components/schemas/Comment"/>

    '
- name: credential_bucket_resource
  x-displayName: CredentialBucket
  description: 'A `credential_bucket` groups credentials for a program (e.g. email or text credentials
    for researchers).


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    #### CredentialBucket resource schema


    <SchemaDefinition schemaRef="#/components/schemas/CredentialBucket"/>

    '
- name: credential_resource
  x-displayName: Credential
  description: 'A `credential` is an assignable login or identifier within a credential bucket.


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    #### Credential resource schema


    <SchemaDefinition schemaRef="#/components/schemas/Credential"/>

    '
- name: customer_asset_resource
  x-displayName: CustomerAssets
  description: 'A `customer_asset` represents a resource which can be tested for security vulnerabilities
    or otherwise worked on by our crowd.

    It could be a piece of software such as authorized softwares, unauthorized softwares, software libraries,

    like .dll and .ocx etc, or hardwares such as Internet of Things (IoT) devices like printers, servers,

    routers etc, or a domain, or a cloud asset like containers, code repositories, storage buckets etc,

    all within an information technology environment.


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    ```shell

    api.bugcrowd.com/customer_assets?filter[created_by]=example@gmail.com&fields[created_by]=name,email

    ```


    #### CustomerAsset resource schema


    <Schema Definition schemaRef="#/components/schemas/CustomerAsset"/>

    '
- name: cvss_vector_resource
  x-displayName: CvssVector
  description: 'If the CVSS calculator is enabled on a program, submissions in that program will have
    a `cvss_vector`

    relationship that can be included from the `/submissions` endpoint.


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    ```shell

    api.bugcrowd.com/submissions?fields[submission]=cvss_vector&include=cvss_vector&fields[cvss_vector]=score

    ```

    #### CvssVector resource schema


    <SchemaDefinition schemaRef="#/components/schemas/CvssVector"/>

    '
- name: disclosure_request_resource
  x-displayName: DisclosureRequest
  description: 'The `disclosure_request` resource defines the researchers requests to publically disclose
    a submission


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    ```shell

    api.bugcrowd.com/disclosure_requests

    ```

    #### Disclosure request resource schema


    <SchemaDefinition schemaRef="#/components/schemas/DisclosureRequest"/>

    '
- name: engagement_resource
  x-displayName: Engagement
  description: 'The `engagement` resource defines a pipe to receive submissions. It is the

    primary resource for the submissions API.


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    ```shell

    api.bugcrowd.com/engagement?

    ```


    #### Engagement resource schema


    < SchemaDefinition schemaRef = "#/components/schemas/Engagement" />

    '
- name: event_resource
  x-displayName: Event
  description: 'The `event` resource describes a historic action on a resource. Currently they are a relationship

    on an `activity` and also the main resource that drives [Webhooks](./#tag/submission_webhooks).


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    ```shell

    api.bugcrowd.com/submissions?fields[submission]=activities&include=activities&fields[activity]=event

    ```


    #### event resource schema


    <SchemaDefinition schemaRef="#/components/schemas/Event"/>

    '
- name: external_issue_resource
  x-displayName: External Issue
  description: 'External Issues can be managed using the `/external_isues` endpoint


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    ```shell

    api.bugcrowd.com/external_issues?include=submissions

    ```


    #### ExternalIssue resource schema


    <Schema Definition schemaRef="#/components/schemas/ExternalIssue"

    '
- name: file_attachment_resource
  x-displayName: FileAttachment
  description: 'File attachments can be included on the `/submissions` endpoint


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    ```shell

    api.bugcrowd.com/submissions?fields[submission]=file_attachments&include=file_attachments&fields[file_attachment]=s3_signed_url

    ```


    #### FileAttachment resource schema


    <SchemaDefinition schemaRef="#/components/schemas/FileAttachment"/>

    '
- name: identity_resource
  x-displayName: Identity
  description: 'The `identity` resource can be the `researcher` on a `submission` or a `payment`, and
    can also

    be the `author` of a `comment` or `assignees` on a `submission`.


    When the identity is a researcher the `email` property will not be available and display of

    the user `name` is controlled by the researcher''s privacy settings.


    When the identity is a Customer team member or Bugcrowd staff member the `email` property will

    be available and the display of the user `name` is controlled by filling in the `display name`

    in their Crowdcontrol settings.


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    ```shell

    api.bugcrowd.com/submissions?fields[submission]=researcher&include=researcher&fields[researcher]=name

    ```


    #### Identity resource schema


    <SchemaDefinition schemaRef="#/components/schemas/Identity"/>

    '
- name: monetary_reward_resource
  x-displayName: MonetaryReward
  description: '#### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    #### MonetaryReward resource schema

    <SchemaDefinition schemaRef="#/components/schemas/MonetaryReward"/>'
- name: organization_resource
  x-displayName: Organization
  description: '> Note: Manage organization members, invitations and program roles requires organization
    Owner or Admin level access


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    #### Organization resource schema


    <SchemaDefinition schemaRef="#/components/schemas/Organization"/>'
- name: payment_resource
  x-displayName: Payment
  description: 'A `payment` is what is paid to researchers and has a relationship on the `monetary_reward`.
    For split

    payments, a single `monetary_reward` can be paid to multiple researchers each with a single `payment`.


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    ```shell

    api.bugcrowd.com/monetary_rewards/MONETARY_REWARD_UUID?fields[monetary_reward]=payments&include=payments&fields[payment]=amount_cents

    ```


    #### Payment resource schema


    <SchemaDefinition schemaRef="#/components/schemas/Payment"/>

    '
- name: program_resource
  x-displayName: Program
  description: '#### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    #### Program resource schema

    <SchemaDefinition schemaRef="#/components/schemas/Program"/>'
- name: reward_range_resource
  x-displayName: RewardRange
  description: 'A `reward_range` can be included through a `target_group`. The `reward_range` is currently
    accessed at

    the `/programs` endpoint as shown with [the `engagement_brief`](#tag/engagement_brief_resource)


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    #### RewardRange resource schema


    <SchemaDefinition schemaRef="#/components/schemas/RewardRange"/>

    '
- name: submission_resource
  x-displayName: Submission
  description: '#### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    #### Submission resource schema

    <SchemaDefinition schemaRef="#/components/schemas/Submission"/>'
- name: submission_webhooks
  x-displayName: Submission webhooks
  description: Webhooks for the `submission` resource
- name: target_group_resource
  x-displayName: TargetGroup
  description: 'A `target_group` can be included through a `engagement_brief` as shown [here](#tag/engagement_brief_resource)


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    #### TargetGroup resource schema


    <SchemaDefinition schemaRef="#/components/schemas/TargetGroup"/>

    '
- name: target_resource
  x-displayName: Target
  description: '#### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    #### Target resource schema

    <SchemaDefinition schemaRef="#/components/schemas/Target"/>'
- name: team_member_resource
  x-displayName: Team
  description: 'The `team` resource defines a group of users that has access to a certain organization/program


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    ```shell

    api.bugcrowd.com/teams/{id}/members?

    ```

    #### Team member resource schema

    < SchemaDefinition schemaRef = "#/components/schemas/TeamMember" />

    '
- name: team_resource
  x-displayName: Team
  description: '> Note: Manage teams and members requires organization Owner or Admin level access

    The `team` resource defines a group of users that has access to a certain organization/program


    #### Request headers

    <SchemaDefinition schemaRef="#/components/schemas/RequestHeaders"/>


    ```shell

    api.bugcrowd.com/teams?

    ```

    #### Team resource schema

    < SchemaDefinition schemaRef = "#/components/schemas/Team" />

    '
x-tagGroups:
- name: API Resources
  tags:
  - submission_resource
  - program_resource
  - activity_resource
  - engagement_resource
  - claim_ticket_resource
  - comment_resource
  - credential_bucket_resource
  - credential_resource
  - cvss_vector_resource
  - event_resource
  - file_attachment_resource
  - identity_resource
