              type: string
            download_url:
              type: string
              description: 'An authenticated endpoint that looks like `files.bugcrowd.com/:file_attachment_id`


                To use this URL you must include the API ''Authorization'' header and it will redirect

                to a signed s3 URL with a 10 second expiry.  This way you can store the

                `download_url` and it will not expire, but the s3 link is kept secure.


                WARNING: DO NOT USE cURL -L to follow the s3 redirect

                CVE: https://curl.se/docs/CVE-2018-1000007.html


                Versions below 7.58.0 automatically forward the authorization headers


                In later versions we will introduce OAuth which will somewhat mitigate the risk

                involved with the authorization header as it will expire.

                '
            s3_signed_url:
              description: 'URL to the file attachment download.  This link expires in 1 minute and encodes
                `&`

                as `\u0026`.  The `\u0026` must be replaced with `&` for the link to work.


                [DEPRECATED] - This attribute will be removed in a future version,

                use `download_url` instead.

                '
