        schema:
          type: string
        example: 10000000-0000-0000-0000-000000000000
      - name: filter[category]
        in: query
        description: Filter by target category
        schema:
          type: array
          items:
            type: string
            enum:
            - api
            - website
            - ios
            - android
            - iot
            - hardware
            - network
            - other
            - ip_address
            - collection
        style: form
        explode: true
      - name: filter[priority]
        in: query
        description: Filter by priority (1-4 or p1-p4 format)
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: filter[coverage]
        in: query
        description: Filter by coverage status
        schema:
          type: array
          items:
            type: string
            enum:
            - in_scope
            - out_of_scope
            - not_assigned
        style: form
        explode: true
      - name: filter[status]
        in: query
        description: Filter by target status
        schema:
          type: array
          items:
            type: string
            enum:
            - open
            - archived
