webhooks:
  pentest.created:
    post:
      summary: Pentest Created
      description: Fired when a new pentest is created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PentestWebhookPayload"
        required: true
      responses:
        "200":
          description: Return a 200 status to indicate successful receipt.
  pentest.state_updated:
    post:
      summary: Pentest State Updated
      description: Fired when a pentest transitions to a new state.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PentestWebhookPayload"
        required: true
      responses:
        "200":
          description: Return a 200 status to indicate successful receipt.
  finding.deleted:
    post:
      summary: Finding Deleted
      description: Fired when a finding is deleted.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingWebhookPayload"
        required: true
      responses:
        "200":
          description: Return a 200 status to indicate successful receipt.
  finding.published:
    post:
      summary: Finding Published
      description: Fired when a finding is published.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingWebhookPayload"
        required: true
      responses:
        "200":
          description: Return a 200 status to indicate successful receipt.
  finding.state_updated:
    post:
      summary: Finding State Updated
      description: Fired when a finding transitions to a new state. The `details`
        field contains the previous and current states.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingStateUpdatedWebhookPayload"
        required: true
      responses:
        "200":
          description: Return a 200 status to indicate successful receipt.
  finding.updated:
    post:
      summary: Finding Updated
      description: Fired when a finding's content is updated.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingWebhookPayload"
        required: true
      responses:
        "200":
          description: Return a 200 status to indicate successful receipt.
  finding.comment.created:
    post:
      summary: Finding Comment Created
      description: Fired when a comment is added to a finding. The `details` field
        contains the comment body and metadata.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingCommentWebhookPayload"
        required: true
      responses:
        "200":
          description: Return a 200 status to indicate successful receipt.
  finding.comment.updated:
    post:
      summary: Finding Comment Updated
      description: Fired when a finding comment is edited. The `details` field
        contains the updated comment body and metadata.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingCommentWebhookPayload"
        required: true
      responses:
        "200":
          description: Return a 200 status to indicate successful receipt.
  finding.comment.deleted:
    post:
      summary: Finding Comment Deleted
      description: Fired when a finding comment is deleted. The `details` field
        contains the comment token and finding ID.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FindingCommentDeletedWebhookPayload"
        required: true
      responses:
        "200":
          description: Return a 200 status to indicate successful receipt.
  test.event:
    post:
      summary: Test Event
      description: Fired when a webhook test is triggered via the API or Cobalt UI.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestEventWebhookPayload"
        required: true
      responses:
        "200":
          description: Return a 200 status to indicate successful receipt.
  dast.finding.detected:
    post:
      summary: DAST Finding Detected
      description: Fired when a new DAST finding is detected.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DastFindingWebhookPayload"
        required: true
      responses:
        "200":
          description: Return a 200 status to indicate successful receipt.
  dast.finding.fixed:
    post:
      summary: DAST Finding Fixed
      description: Fired when a DAST finding is marked as fixed.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DastFindingWebhookPayload"
        required: true
      responses:
        "200":
          description: Return a 200 status to indicate successful receipt.
  engagement.created:
    post:
      summary: Engagement Created
      description: Fired when a new engagement is created.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngagementWebhookPayload"
