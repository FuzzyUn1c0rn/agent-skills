openapi: 3.1.0
info:
  title: Cobalt API
  description: >-
    # Introduction


    The [Cobalt](https://cobalt.io) API gives you REST access to Organizations,
    Assets, Pentests, Findings, and Events.


    > **Note:** We are actively working to improve the usability of our API and
    welcome your feedback: **integrations@cobalt.io**


    ---


    # Authentication


    Cobalt uses API tokens to allow access to various endpoints. You can create
    a new Cobalt API token from within your [Cobalt
    profile](https://app.cobalt.io/settings/api-token).


    Cobalt expects the API token to be included in all API requests to the
    server in a header that looks like the following:


    `Authorization: Bearer YOUR-PERSONAL-API-TOKEN`


    > **Note:** You must replace **YOUR-PERSONAL-API-TOKEN** with your personal
    API token. DO NOT remove the word Bearer.


    Most API calls are scoped to a specific organization, with the `X-Org-Token`
    header. We include that header, as needed, in our API calls.


    To see which organizations you belong to:


    - Send a GET request to the `/orgs` endpoint.

    - Copy the `token` attribute associated with your target organization from
    the response.

    - Include it as a header (`X-Org-Token`) to your requests when required.


    > **Warning:** If your organization uses SAML for authentication with
    Cobalt, API tokens are not currently disabled when a user is offboarded from
    SAML. To disable API access by offboarded personnel, you must manually
    remove them from your organization via the "People" tab on the Cobalt
    platform. Automating this offboarding process is a high-priority issue for
    Cobalt and an automated solution will be released as soon as possible.


    ---


    # EU Data Center


    > **Note:** The information in this section is specifically for customers
    using the EU data center (app.eu.cobalt.io).


    If you're using the EU data center and need to call the API, the base URL
    differs from the examples in this documentation, which use the US base URL.


    The base URL for EU data center customers is `https://api.eu.cobalt.io`.
    Replace `https://api.us.cobalt.io` with `https://api.eu.cobalt.io` in all
    examples.


    If you encounter any issues or need further assistance, contact
    [integrations@cobalt.io](mailto:integrations@cobalt.io).


    ---


    # Pagination


    Pagination can be used if the number of resources for a request exceeds the
    value of the `limit` query parameter of the request. If the `next_page`
    and/or `prev_page` values in the response are non-`null` there are
    additional resources. To paginate, append the `next_page` or `prev_page`
    value to the base API URL.


    For example, if the `next_page` value in a response is
    `/resource?cursor=a1b2c3d4` you can send the following request for the next
    page:


    `GET https://api.us.cobalt.io/resource?cursor=a1b2c3d4`


    > **Note:** There is always a default value for the `limit` query parameter.


    ---


    # Idempotency


    The API supports [idempotency](https://en.wikipedia.org/wiki/Idempotence)
    for safely retrying requests without accidentally performing the same
    operation twice. This is useful when an API call is disrupted in transit and
    you do not receive a response. For example, if a request to create an asset
    does not respond due to a network connection error, you can retry the
    request with the same idempotency key to guarantee that no more than one
    asset is created.


    To perform an idempotent request, provide an additional `Idempotency-Key:
    <key>` header to the request. The header name `Mutation-Check` is also
    supported for backwards compatibility with previous versions of the API.


    An idempotency key is a unique value generated by the client which the
    server uses to recognize subsequent retries of the same request. How you
    create unique keys is up to you, but we suggest using V4 UUIDs, or another
    random string with enough entropy to avoid collisions.


    All `POST` requests optionally accept idempotency keys. Idempotency keys
    expire after 5 minutes.


    ---


    # Rate Limits


    The Cobalt API sets rate limits on API requests to manage request volume and
    maintain system availability.


    - Rate limiting follows a **fixed-window policy**, with a maximum number of
    requests allowed in a specific time window.

    - Rate limiting applies on a **per-user basis**, regardless of how many API
    tokens the user has.


    ## Limits


    | Request Type | HTTP Verbs | Limit | Window | HTTP Response Headers |

    |---|---|---|---|---|

    | Get requests | `GET` | 100 | 60 seconds | `X-Rate-Limit-Get-Limit` and
    `X-Rate-Limit-Remaining` |

    | Mutate requests | `POST`, `PATCH`, `PUT`, `DELETE` | 20 | 60 seconds |
    `X-Rate-Limit-Mutate-Limit` and `X-Rate-Limit-Remaining` |


    ## HTTP Response Headers


    - `X-Rate-Limit-Get-Limit`: Maximum number of `GET` requests allowed per
    time window. Example: `X-Rate-Limit-Get-Limit: 100`

    - `X-Rate-Limit-Mutate-Limit`: Maximum number of mutate requests allowed per
    time window. Example: `X-Rate-Limit-Mutate-Limit: 20`

    - `X-Rate-Limit-Remaining`: Number of requests remaining in the current time
    window. Example: `X-Rate-Limit-Remaining: 93`


    ## When the Rate Limit Is Exceeded


    When a user exceeds the rate limit, the API returns a `429
    TOO_MANY_REQUESTS` HTTP response code along with the headers above. The rate
    limit resets after the specified time window.


    ---


    # Errors


    > **Note:** This error section helps you identify the type of error you're
    running into. If you think you're experiencing a bug, or seeing incorrect
    data please reach out: **integrations@cobalt.io**


    The Cobalt API uses the following error codes:


    | Error Code | Meaning |

    |------------|---------|

    | 400 | Bad Request — Your request is not good |

    | 401 | Unauthorized — Your API token is wrong |

    | 403 | Forbidden — You don't have access to this resource |

    | 404 | Not Found — The specified request could not be found |

    | 405 | Method Not Allowed — You tried to access Cobalt data with an invalid
    method |

    | 406 | Not Acceptable — You requested a format that isn't json |

    | 409 | Conflict — You attempted to create a resource with the same
    `Idempotency-Key` header as a recent request |

    | 410 | Gone — The requested endpoint has been removed from Cobalt servers |

    | 418 | I'm a teapot |

    | 422 | Unprocessable Entity — The content and syntax are correctly formed,
    but something else is off |

    | 429 | Too Many Requests — You're making requests too often |

    | 500 | Internal Server Error — We had a problem with our server. Try again
    later |

    | 503 | Service Unavailable — We're temporarily offline for maintenance.
    Please try again later |


    ---


    # Partner Integrations


    We request that you set a custom `User-Agent` header when developing a
    partner integration. The custom `User-Agent` header should identify your
    integration, which allows us to identify traffic originating from your
    integration for analytical and troubleshooting purposes.


    Format: `User-Agent: [IntegrationName]/[IntegrationVersion]`


    Example: `User-Agent: PartnerCobaltIntegration/1.0.0`


    The `User-Agent` header is not required, but we strongly encourage partner
    integrations to send it.


    ---


    # Changelog


    ## New Endpoints in v2


    In the v2 release, the following additional endpoints were published:


    - Get / Create / Update / Delete an Asset

    - Upload / Delete an Asset Attachment

    - Upload an Asset Logo

    - Get a Pentest / Pentest Report

    - Duplicate / Delete a Pentest

    - Create / Update a Pentest

    - Get a Finding

    - View Available Finding States / Update Finding State

    - Get all / Get / Create / Update / Delete a Webhook

    - Get Credit Transactions / Balance / Contracts


    ## Identifier Changes


    In v2, identifiers were standardized across all endpoints. Either the
    structure or the length of some identifiers changed:


    | Endpoint | Response field | v1 (example) | v2 (example) |

    |---|---|---|---|

    | organizations | `id` | `or_A2bb4FE` | `or_Uevoq7MyoYsPT9NPc3conL` |

    | organizations | `token` | `ABCDEFGHJ12345678901` |
    `ASDFGHJKLQWERTYUM1234567890ABCDEFGH1234567891234` |

    | assets | `id` | `as_rvZRC5Y` | `as_GZgcehapJUNh6mjNuqsE4T` |

    | assets | `attachments.token` | `att_yYXZodA` | `at_LA5GcEL4HRitFGCHREqmzL`
    |

    | pentests | `id` | `pt_rVShby8` | `pt_JQJpAAMjyc8xVtXW2X2Aq5` |

    | findings | `id` | `vu_ZzZuekb` | `vl_3xP2RCWWUajc3oRXmbQ4j9` |

    | events | `id` | `277603` | `ac_Y35JcpGoakrjUSVjtVpXyH` |


    The `attachments.token` field in the v1 assets endpoint was renamed to `id`
    in v2.


    We aren't expecting any of these to be breaking changes for the majority of
    customers, but if you have validations in place concerning identifier
    prefixes or string lengths, please update them accordingly.


    The `token` attribute of the organizations endpoint returns a different,
    longer string in v2. This value is used as the `X-Org-Token` header when
    calling org-scoped endpoints.


    ## Request Headers


    | Header | v1 | v2 | Description |

    |---|---|---|---|

    | `Accept` | `application/vnd.cobalt.v1+json` |
    `application/vnd.cobalt.v2+json` | Must be present in all requests |

    | `Content-Type` | N/A | `application/vnd.cobalt.v2+json` | Required for
    POST/PUT/DELETE requests |

    | `Idempotency-Key` | N/A | Optional on POST requests | See Idempotency
    section |


    In v1, the API was read-only. v2 adds create, update, and delete operations,
    along with the `Content-Type` and `Idempotency-Key` headers.


    ## Pagination Defaults


    In v1, some endpoints had 10 and others had 1000 as their default pagination
    value. In v2, all endpoints default to 10:


    | Endpoint | v1 default | v2 default |

    |---|---|---|

    | pentests | 1000 | 10 |

    | findings | 1000 | 10 |
  contact:
    email: integrations@cobalt.io
  version: v2
servers:
  - url: https://api.us.cobalt.io
    description: Production
tags:
  - name: Orgs
    description: Retrieve the organizations you belong to. Save the `token` field
      from each organization response — this is your organization token, passed
      as the `X-Org-Token` header in subsequent calls to scope requests to a
      specific organization.
  - name: Assets
    description: >-
      Assets represent the applications, networks, or systems owned by an
      organization that are targets for security testing. All asset endpoints
      are scoped to the organization specified in the `X-Org-Token` header.


      Asset types: `api`, `cloud_config`, `external_network`,
      `internal_network`, `mobile`, `web`, `web_plus_api`, `web_plus_mobile`,
      `wireless_network`, `iot`, `thick_client`, `physical`, `other`.


      Attachment download URLs are pre-authorized and expire after 10 minutes.
      Deleting an asset also deletes all associated tags.
  - name: Pentests
    description: >-
      Pentests represent scheduled security testing engagements against an
      asset. All pentest endpoints are scoped to the organization specified in
      the `X-Org-Token` header.


      ## Pentest States


      | State | Description |

      |-------|-------------|

      | `new` | Draft — the pentest is being configured |

      | `in_review` | Submitted for review by Cobalt |

      | `planned` | Scheduled and ready to start |

      | `live` | Testing is in progress |

      | `remediation` | Testing complete; findings are being remediated |

      | `closed` | The pentest is complete |

      | `cancelled` | The pentest was cancelled |


      ## Creating a Pentest


      `POST /pentests` creates a **draft**. It does not submit the pentest to
      Cobalt.


      There is no API endpoint that moves a pentest from `new` to `in_review`;
      `state` is not a writable field on create or update. Submitting a draft
      for review is done from the Cobalt platform UI. Use the API to build and
      populate the draft, then submit it in the UI.


      Creating a pentest requires an existing asset. Create one with `POST
      /assets` first and pass its ID as `asset_id`.


      ### Field Notes


      Several fields are easy to confuse with one another:


      | Field | What belongs here |

      |---|---|

      | `description` | Testing objectives. Returned as `objectives` on pentest
      responses — the response has no `description` field. |

      | `instructions` | Testing priorities and exclusions. Shown in the UI as
      "Prioritization or exclusions". |

      | `test_credentials` | How testers reach the environment: VPN details,
      accounts, tokens. Shown in the UI as "Access Instructions". |

      | `additional_requests` | Anything no other field covers. |

      | `point_of_contacts` | **Usernames** of existing pentest collaborators,
      not email addresses. Each must already be a collaborator on the pentest. |


      `instructions`, `test_credentials`, `description`, and
      `additional_requests` all accept markdown.


      `targets` is a single **comma-separated string**, not an array:


      ```json

      { "targets": "https://www.example.com,https://api.example.com" }

      ```


      Targets that do not yet exist in the organization are created
      automatically as part of the request.


      `testing_type` defaults to `comprehensive` when omitted on create.


      ### Scoping


      `scoping` is keyed by asset type. Set only the key matching the asset
      under test, and populate every count under that key:


      | Key | Required counts |

      |---|---|

      | `api` | `num_of_endpoints`, `num_of_roles` |

      | `web` | `num_of_pages`, `num_of_roles` |

      | `mobile` | `num_of_views`, `num_of_roles`, `num_of_operating_systems` |

      | `network` | `num_of_ips` |

      | `cloud_config` | `num_of_services`, `num_of_accounts` |


      ```json

      { "scoping": { "web": { "num_of_pages": 20, "num_of_roles": 2 } } }

      ```


      Unrecognized keys are ignored rather than rejected, so a misspelled key
      does not produce a validation error — it surfaces later as incomplete
      scoping. Check the spelling against the table above if scoping appears to
      have been dropped.


      ## Updating a Pentest


      `PUT /pentests/{pentestId}` replaces the pentest brief rather than
      patching it. `asset_id`, `title`, `description`, and `technology_stack`
      are required on every call.


      Omitting an optional field is not the same as leaving it alone.
      `instructions`, `test_credentials`, `test_credentials_option`,
      `additional_requests`, `scoping`, `targets`, and `image` are forwarded as
      empty when absent from the request body, which clears whatever was
      previously set. Read the pentest first and send back the full brief with
      your changes applied.


      Fields that are absent from the request are left untouched for the
      remaining optional attributes, including `start_date`, `end_date`,
      `coverage`, `size`, `num_of_credits`, `methodology`, `out_of_scope_urls`,
      `test_goals`, `test_data_types`, `test_environments`,
      `tester_requirements`, `collaboration_channel`, and `point_of_contacts`.


      ## Notes


      - New pentests are created in **Draft** (`new`) state.

      - Pentests can only be deleted when in draft or review state.

      - Pentests cannot be duplicated when in draft state. A duplicate is always
      created in draft state with the same brief as the original.

      - Pentest report visibility depends on whether the report has been
      finalized and the role of the user who owns the API token. A `404` on the
      report endpoint when the pentest is viewable typically indicates a
      permissions issue.
  - name: Findings
    description: |-
      Findings are vulnerability reports created by pentesters during a pentest. The `log` array on each finding presents a history of state changes and other actions with corresponding timestamps. All finding endpoints are scoped to the organization specified in the `X-Org-Token` header.

      Finding comments (list, create, update, delete) are also part of this tag, available at `/findings/{findingId}/comments`.

      ## Finding States

      The table below describes how the finding state values used by the API correspond to finding states shown in the user interface.

      | API Value | UI Name | Description |
      |-----------|---------|-------------|
      | `new` | Draft | A pentester has created a draft finding but has not yet submitted it for triaging |
      | `triaging` | Triaging | The finding is being triaged |
      | `need_fix` | Pending Fix | The finding is valid and needs to be fixed |
      | `check_fix` | Ready for Retest | A fix is awaiting validation by a pentester |
      | `valid_fix` | Fixed | The finding was fixed and validated by a pentester |
      | `wont_fix` | Accepted Risk | The risk has been accepted. The finding will not be fixed |
      | `carried_over` | Carried Over | The finding was carried over from a previous pentest |
      | `not_applicable` | Not Applicable | The finding is not applicable |
      | `invalid` | Invalid | The finding is invalid |
      | `duplicate` | Invalid | The finding is invalid (deprecated state) |
      | `stale` | Invalid | The finding is invalid (deprecated state) |
      | `out_of_scope` | Invalid | The finding is invalid (deprecated state) |

      Use `GET /findings/{findingId}/possible_states` to retrieve the current state and all valid next states for a specific finding before calling `PATCH /findings/{findingId}` to update it.

      ## Severity Calculations

      Risk is calculated following the OWASP risk model: `Risk = Impact * Likelihood`

      - `impact` and `likelihood`: 1–5
      - `severity` is `null` until both values are set by the pentester

      | Category | Score | Description |
      |----------|-------|-------------|
      | `critical` | 25 | Includes vulnerabilities that require immediate attention |
      | `high` | 16–24 | Impacts the security of your application/platform/hardware, including supported systems. Includes high probability vulnerabilities with a high business impact |
      | `medium` | 5–15 | Includes vulnerabilities that are: medium risk, medium impact; low risk, high impact; high risk, low impact |
      | `low` | 2–4 | Specifies common vulnerabilities with minimal impact |
      | `informational` | 1 | Notes vulnerabilities of minimal risk to your business |

      ## Image Attachments

      Several finding response fields support inline image attachments. By default these are rendered as Markdown, for example:

      `![screenshot.png](https://api.us.cobalt.io/v1/attachments/att_xxxxxxx/preview)`

      For programmatic access, request `image_attachments_render_format=token` to receive a token format instead:

      `<CobaltImageAttachment at_KYKDAhZPXuQ4BW23g8i9QN>`

      Use the token to locate the full attachment object in the `attachments` array and download via its `download_url`. Attachment download URLs are pre-authorized and expire after 10 minutes.

      ## Finding Comments

      Finding comments support collaboration and external system integration. Comments are available via:

      - `GET /findings/{findingId}/comments`
      - `POST /findings/{findingId}/comments`
      - `GET /findings/{findingId}/comments/{commentToken}`
      - `PATCH /findings/{findingId}/comments/{commentToken}`
      - `DELETE /findings/{findingId}/comments/{commentToken}`

      When creating comments from external systems (e.g., Jira, ServiceNow), include `author_name`, `author_email`, `source_system`, and `external_comment_id` to track the origin. Deleted comments are soft-deleted and remain in the list with `body` set to a placeholder string.

      Webhook events are available for finding comment changes: `FINDING_COMMENT_CREATED`, `FINDING_COMMENT_UPDATED`, `FINDING_COMMENT_DELETED`.
  - name: Events
    description: >-
      Events represent a feed of activities for your account, such as comment
      creation, pentest state changes, and finding creation.


      For real-time notifications via HTTP POST instead of polling, see the
      Webhooks endpoints.
  - name: Tokens
    description: >-
      API tokens authenticate requests to the Cobalt API. You can list and
      refresh your tokens via the API, or manage them from your [Cobalt
      profile](https://app.cobalt.io/settings/api-token).


      ## Token Refresh


      You can revoke an existing token and issue a new one with the same name:


      1. `GET /tokens` — note the `id` of the token you would like to refresh.

      2. `POST /tokens/{id}/refresh` — the new token value is returned in the
      `secret` field. Your old token immediately stops working.


      If you have forgotten your token, log in to the Cobalt web app, go to your
      profile, revoke the old token, and generate a new one.
  - name: Webhooks
    description: >-
      Webhooks allow your system to be notified when events occur on the Cobalt
      Platform via HTTP POST requests. This eliminates the need to poll the API
      for updates. You can also manage webhooks within the Integrations Hub in
      the Cobalt Platform.


      Webhook event types and their payload schemas are documented in the
      **Webhooks** section of the sidebar.


      ## Delivery and Health


      - When a subscribed event occurs, Cobalt sends an HTTP POST to your
      webhook URL.

      - If your endpoint responds with a successful HTTP status code (e.g., 200,
      201, or 204), the delivery is marked successful.

      - If the endpoint does not respond with a successful status, Cobalt
      retries delivery 5 more times with 5 seconds between each attempt.

      - If all delivery attempts fail, the endpoint is marked unhealthy and the
      event is placed in a failed events queue.

      - Cobalt attempts to redeliver failed events on an hourly interval.

      - If the endpoint recovers and begins accepting events, it is
      automatically marked healthy again.

      - If the endpoint remains unhealthy for 48 hours, the webhook is
      deactivated. You must reactivate it via the API or the Cobalt UI.


      ## Best Practices


      1. **Validate the webhook secret.** Set your webhook `secret` to a
      high-entropy value of sufficient length. When you receive an event, verify
      that the value in the `X-Secret` header matches your secret to confirm the
      event originates from Cobalt.

      2. **Keep your endpoint lightweight.** Avoid expensive operations in the
      endpoint that receives webhook events. A common pattern is to receive
      events with a lightweight endpoint that publishes them to a message queue,
      then process them asynchronously. This keeps latency and failure rates
      low.
  - name: Engagements
    description: >-
      Engagements represent security reviews other than traditional pentests,
      such as secure code reviews and digital risk assessments. All engagement
      endpoints are scoped to the organization specified in the `X-Org-Token`
      header.


      ## Engagement Types


      | Type | Description |

      |------|-------------|

      | `secure_code_review` | A review of source code for security
      vulnerabilities |

      | `digital_risk_assessment` | An assessment of digital risk exposure |


      ## Engagement States


      `draft`, `in_review`, `planned`, `live`, `remediation`, `closed`,
      `cancelled`


      The fields returned by `GET /engagements/{id}` vary by engagement type.
      Use the `engagement_type` field to determine which fields are present.
  - name: EngagementFindings
    description: >-
      Engagement findings are vulnerability reports created during engagements
      (secure code reviews and digital risk assessments). All engagement finding
      endpoints are scoped to the organization specified in the `X-Org-Token`
      header.


      ## Finding States


      | API Value | UI Name | Description |

      |-----------|---------|-------------|

      | `new` | Draft | A pentester has created a draft finding but has not yet
      submitted it for triaging |

      | `triaging` | Triaging | The finding is being triaged |

      | `need_fix` | Pending Fix | The finding is valid and needs to be fixed |

      | `check_fix` | Ready for Retest | A fix is awaiting validation by a
      pentester |

      | `valid_fix` | Fixed | The finding was fixed and validated by a pentester
      |

      | `wont_fix` | Accepted Risk | The risk has been accepted. The finding
      will not be fixed |

      | `invalid` | Invalid | The finding is invalid |

      | `duplicate` | Invalid | The finding is invalid |

      | `out_of_scope` | Invalid | The finding is invalid |


      ## Severity Calculations


      Risk is calculated following the OWASP risk model: `Risk = Impact *
      Likelihood`


      - `impact` and `likelihood`: 1–5

      - `severity` is `null` until both values are set


      | Category | Score | Description |

      |----------|-------|-------------|

      | `critical` | 25 | Includes vulnerabilities that require immediate
      attention |

      | `high` | 16–24 | Impacts the security of your
      application/platform/hardware, including supported systems. Includes high
      probability vulnerabilities with a high business impact |

      | `medium` | 5–15 | Includes vulnerabilities that are: medium risk, medium
      impact; low risk, high impact; high risk, low impact |

      | `low` | 2–4 | Specifies common vulnerabilities with minimal impact |

      | `informational` | 1 | Notes vulnerabilities of minimal risk to your
      business |


      ## Finding Types


      The fields returned vary by finding type. Use the `finding_type` field to
      determine which fields are present:


      - `secure_code_review_finding` — includes `code_snippets` and `cvss_score`

      - `digital_risk_assessment_finding` — includes `prerequisites`


      The `ENGAGEMENT_FINDING_STATE_UPDATED` webhook event fires when an
      engagement finding's state is updated.
  - name: DAST Targets
    description: DAST (Dynamic Application Security Testing) targets are the web
      application URLs that DAST scans run against. All DAST target endpoints
      are scoped to the organization specified in the `X-Org-Token` header.
  - name: DAST Scans
    description: >-
      DAST scans are automated security scans run against DAST targets. A scan
      progresses through several states from creation to completion. All DAST
      scan endpoints are scoped to the organization specified in the
      `X-Org-Token` header.


      ## Scan States


      | State | Description |

      |-------|-------------|

      | `queued` | The scan has been submitted and is waiting to start |

      | `started` | The scan is actively running |

      | `pausing` | A pause has been requested |

      | `paused` | The scan is paused |

      | `resuming` | A resume has been requested |

      | `canceling` | A cancellation has been requested |

      | `canceled` | The scan was cancelled |

      | `under_review` | The scan has completed and results are being reviewed |

      | `finishing_up` | Post-scan processing is in progress |

      | `completed` | The scan completed successfully |

      | `completed_with_errors` | The scan completed but encountered errors |

      | `failed` | The scan failed |


      ## Scheduled Scans


      DAST scans can be scheduled to run automatically at a specific date/time,
      with optional recurrence (`WEEKLY`, `MONTHLY`, or `QUARTERLY`). Scheduled
      scans are managed via `POST /dast/targets/{targetId}/scheduled_scans`.
  - name: DAST Findings
    description: >-
      DAST findings are vulnerabilities discovered by automated DAST scans. All
      DAST finding endpoints are scoped to the organization specified in the
      `X-Org-Token` header.


      ## Finding States


      | State | Description |

      |-------|-------------|

      | `need_fix` | The finding is valid and needs to be fixed |

      | `wont_fix` | The risk has been accepted; the finding will not be fixed |

      | `invalid` | The finding is invalid |

      | `check_fix` | A fix has been applied and is awaiting retest |

      | `valid_fix` | The fix was validated via a retest |


      > **Note:** Changing the state to `check_fix` or `valid_fix` is not
      possible via the update endpoint. Use the retest endpoint (`POST
      /dast/findings/{id}/retest`) instead. A retest runs a short scan to
      determine if the finding can still be detected; the state updates
      automatically when the retest completes.
  - name: Attack Surface
    description: Attack surface statistics provide a high-level view of the domains
      and hosts discovered for your organization. All attack surface endpoints
      are scoped to the organization specified in the `X-Org-Token` header.
  - name: External Finding References
    description: >-
      External ticket references link Cobalt findings to tickets in external
      issue tracking systems. All external ticket reference endpoints are scoped
      to the organization specified in the `X-Org-Token` header.


      > **Note:** This API only surfaces external ticket references created via
      the Integration Builder or the public API. References created via older
      native Jira and GitHub integrations are not available here.


      ## Search Filters


      The search endpoint (`POST /external_ticket_references/search`) accepts
      these optional filters in the request body:


      - `findings` — an array of finding ID objects, e.g. `[{"id": "vl_..."},
      {"id": "dfi_..."}]`

      - `ticketing_system` — one of the supported ticketing system identifiers
      below

      - `external_id` — case-sensitive full match against the external ticket's
      identifier


      > **Note:** If `findings` is present but empty, the result is always
      empty. `external_id` matching is case-sensitive and does not support
      partial matches, regex, or wildcards.


      ## Supported Ticketing Systems


      The `ticketing_system` field accepts any arbitrary string, but using one
      of the following values allows Cobalt to display the ticketing system's
      logo in the UI:


      `asana`, `azure_devops_boards`, `bmc`, `basecamp`, `bitbucket`, `clickup`,
      `freshservice`, `github`, `gitlab`, `hive`, `jira`, `monday`,
      `pivotaltracker`, `servicenow`, `trello`, `wrike`, `zendesk`
  - name: Balance
    description: Retrieve the current credit balance for your organization. All
      balance endpoints are scoped to the organization specified in the
      `X-Org-Token` header.
  - name: Contracts
    description: Retrieve the contracts associated with your organization, including
      credit allocation and usage. All contract endpoints are scoped to the
      organization specified in the `X-Org-Token` header.
  - name: CreditTransactions
    description: Retrieve the credit transaction history for your organization. All
      credit transaction endpoints are scoped to the organization specified in
      the `X-Org-Token` header.
