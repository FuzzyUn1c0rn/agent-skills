  /findings:
    get:
      tags:
        - Findings
      summary: Get all Findings
      description: Get Findings for your org. If you want to fetch findings for one of
        the assets firstly use /assets endpoint to get asset id and filter
        findings using asset parameter.
      operationId: CAPIv2GetFindings
      parameters:
        - name: cursor
          in: query
          description: Used for pagination
          required: false
          schema:
            type: string
          example: https://api.us.cobalt.io/findings?cursor=a1b2c3d4
        - name: limit
          in: query
          description: Limit the number of findings returned
          required: false
          schema:
            type: integer
            maximum: 1000
            minimum: 1
          example: 10
        - name: pentest
          in: query
          description: Filter findings by pentest ID
          schema:
            type: string
          example: pt_QQVArMBzfzsv2EkXrwm3qP
        - name: asset
          in: query
          description: Filter findings by asset ID
          schema:
            type: string
          example: as_TCopTvR3DZassjnKyyo3o9
        - name: state
          in: query
          description: Filter findings by state
          schema:
            type: string
            enum:
              - new
              - triaging
              - need_fix
              - check_fix
              - valid_fix
              - wont_fix
              - carried_over
              - not_applicable
              - invalid
              - duplicate
              - stale
              - out_of_scope
          example: check_fix
        - name: severity
          in: query
          description: Filter findings by severity
          schema:
            type: string
            enum:
              - very_low
              - low
              - medium
              - high
              - very_high
          example: medium
        - name: labels_contains_all[]
          in: query
          description: Filter findings by labels
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
          example: Awaiting Feedback
        - name: created_at_lte
          in: query
          description: Filter findings created before or at the specified date
          schema:
            type: string
            format: date-time
          example: 2020-02-20T15:28:10.335Z
        - name: created_at_gte
          in: query
          description: Filter findings created after or at the specified date
          schema:
            type: string
            format: date-time
          example: 2020-02-20T15:28:10.335Z
        - name: updated_at_lte
          in: query
          description: Filter findings updated before or at the specified date
          schema:
            type: string
            format: date-time
          example: 2020-02-20T15:28:10.335Z
        - name: updated_at_gte
          in: query
          description: Filter findings updated after or at the specified date
          schema:
            type: string
            format: date-time
          example: 2020-02-20T15:28:10.335Z
        - name: sort
          in: query
          description: Sort findings by field. To sort in descending order, use a - before
            the sort parameter.
          schema:
            type: string
            enum:
              - severity
              - impact
              - state
              - created_at
              - updated_at
              - -severity
              - -impact
              - -state
              - -created_at
              - -updated_at
          example: severity
        - name: image_attachments_render_format
          in: query
          description: Format of image attachments in findings
          required: false
          schema:
            type: string
            enum:
              - markdown
              - token
          example: markdown
        - name: X-Org-Token
          in: header
          required: true
          schema:
            type: string
            description: Organization Token
            example: b3JfVEFFUmFhWlZiOU1SSndBcHpNU2NZNCQkbW9oci13YWxrZXItOQ==
        - name: X-Request-Id
          in: header
          required: false
          schema:
            type: string
        - name: User-Agent
          in: header
          required: false
          schema:
            type: string
        - name: includeAttachments
          in: query
          description: Whether to include finding attachments in the response. Defaults to
            true. Setting this to false is noticeably faster and recommended
            when attachment data is not needed.
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "400":
          description: Bad Request
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not Found
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported Media Type
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Unprocessable Content
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
