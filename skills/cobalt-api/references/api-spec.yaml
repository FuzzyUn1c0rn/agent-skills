components:
  schemas:
    ApiError:
      properties:
        message:
          type: string
        type:
          type: string
        request_id:
          type: string
        request_id_note:
          type: string
      required:
        - message
        - request_id_note
        - type
    ErrorResponse:
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
      required:
        - error
    API:
      description: API scoping. Both counts are required.
      example:
        num_of_endpoints: 6
        num_of_roles: 2
      properties:
        num_of_endpoints:
          type: integer
          format: int32
          description: Number of endpoints in scope.
          example: 1
        num_of_roles:
          type: integer
          format: int32
          description: Number of distinct user roles to test with.
          example: 1
      required:
        - num_of_endpoints
        - num_of_roles
    CloudConfig:
      description: Cloud configuration scoping. Both counts are required.
      example:
        num_of_services: 4
        num_of_accounts: 2
      properties:
        num_of_services:
          type: integer
          format: int32
          description: Number of cloud services in scope.
          example: 1
        num_of_accounts:
          type: integer
          format: int32
          description: Number of cloud accounts in scope.
          example: 1
      required:
        - num_of_accounts
        - num_of_services
    CreateOrUpdatePentestRequestBody:
      properties:
        asset_id:
          type: string
          description: Cobalt ID of the asset under test. The asset must already exist in
            the organization identified by the X-Org-Token header; create it via
            POST /assets first.
          example: as_TCopTvR3DZassjnKyyo3o9
        title:
          type: string
          example: Pentest Title
        description:
          type: string
          description: Testing objectives. Returned as `objectives` on pentest responses,
            not as `description`.
          example: This is a description/objective of the pentest
        start_date:
          type: string
          format: date
          description: Requested start date. Cobalt confirms the final schedule while the
            pentest is in review, so the dates returned later may differ from
            the ones submitted here.
          example: 2022-10-01
        end_date:
          type: string
          format: date
          example: 2022-10-01
        coverage:
          type: string
          enum:
            - extra_light
            - light
            - standard
            - large
            - extra_large
          example: standard
        size:
          type: string
          enum:
            - xs
            - s
            - m
            - l
            - xl
          example: m
        num_of_credits:
          type: integer
          format: int32
          example: 3
        instructions:
          type: string
          description: Testing priorities and exclusions, in markdown. Appears in the
            Cobalt UI as "Prioritization or exclusions". For environment access
            details use `test_credentials` instead.
          example: The targets specified and in the postman suite are the only endpoints
            in scope.
        technology_stack:
          type: string
          description: Languages, frameworks, and platforms the target is built on.
            Required.
          example: C#, Java
        test_credentials_option:
          type: string
          enum:
            - provided
            - distributed
            - not_required
          example: provided
        additional_requests:
          type: string
          description: Anything else Cobalt should know that no other field covers, in
            markdown.
          example: Please avoid automated scanning between 09:00 and 17:00 UTC.
        test_credentials:
          type: string
          description: 'How testers reach the target environment: VPN details, accounts,
            tokens, in markdown. Appears in the Cobalt UI as "Access
            Instructions".'
          example: >-
            VPN

            Testers must be on our VPN. Credentials will be added to the pentest
            after creation.
        targets:
          type: string
          description: In-scope targets as a single comma-separated string, not an array.
            Values that do not yet exist in the organization are created
            automatically.
          example: https://www.example.com,https://api.example.com
        testing_type:
          type: string
          description: Defaults to `comprehensive` when omitted on create.
          enum:
            - comprehensive
            - agile
            - internal_team
            - specialized
            - continuous
            - autonomous
        scoping:
          $ref: "#/components/schemas/ScopingBody"
        methodology:
          type: string
          example: web
        out_of_scope_urls:
          type: array
          items:
            type: string
        test_goals:
          type: array
          items:
            type: string
            enum:
              - compliance_audit
              - m&a_due_diligence
              - attestation_request
              - new_feature_release
              - delta_testing
              - internal_security_testing
              - microservice_testing
              - vulnerability_validation
              - other
        test_data_types:
          type: array
          items:
            type: string
            enum:
              - not_applicable
              - personally_identifiable_information
              - protected_health_information
              - cardholder_data
              - biometric_data
        test_environments:
          type: array
          items:
            type: string
            enum:
              - not_applicable
              - production
              - staging
              - qa_development
        tester_requirements:
          type: array
          items:
            type: string
